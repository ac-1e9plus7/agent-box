packages:
  - .

# Patched compatible releases for vulnerable transitive build/runtime dependencies.
overrides:
  '@xmldom/xmldom@<0.9.0': ^0.8.15
  '@xmldom/xmldom@>=0.9.0 <0.9.12': ^0.9.12
  'ansi-regex@>=4 <5': ^4.1.1
  'ansi-regex@>=5 <6': ^5.0.1
  'ejs@>=3 <3.1.10': ^3.1.10
  'fast-uri@>=3 <3.1.6': ^3.1.6
  'hono@<4.13.5': ^4.13.5
  'js-yaml@>=4 <4.3.2': ^4.3.2
  'qs@<6.16.0': ^6.16.0
  'semver@>=5 <5.7.2': ^5.7.2

allowBuilds:
  electron: true
  electron-winstaller: true
  esbuild: true

minimumReleaseAgeExclude:
  - '@zip.js/zip.js@2.8.57'
  - electron@44.4.1

onlyBuiltDependencies:
  - electron
  - electron-winstaller
  - esbuild

patchedDependencies:
  app-builder-lib@26.15.7: patches/app-builder-lib@26.15.7.patch
