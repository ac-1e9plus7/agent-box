name: Build Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            arch: x64
            build_args: --x64
          - os: windows-latest
            arch: arm64
            build_args: --arm64
          - os: macos-latest
            arch: native
            build_args: ''
          - os: ubuntu-latest
            arch: x64
            build_args: --x64
          - os: ubuntu-latest
            arch: arm64
            build_args: --arm64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Setup Node.js and pnpm
        uses: pnpm/setup@v2
        with:
          version: 11.24.0
          runtime: node@24
          cache: true
          install: false

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Quality Checks
        run: pnpm check

      - name: Typecheck & Build
        run: pnpm build

      - name: Package Application
        run: pnpm exec electron-builder --publish never ${{ matrix.build_args }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: agentbox-${{ runner.os }}-${{ matrix.arch }}
          if-no-files-found: error
          path: |
            release/*.exe
            release/*.dmg
            release/*.AppImage

  publish:
    name: Publish GitHub Release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download Build Artifacts
        uses: actions/download-artifact@v8
        with:
          path: downloaded-artifacts

      - name: Stage Release Assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          for artifact_dir in downloaded-artifacts/agentbox-*; do
            artifact_name="${artifact_dir##*/}"
            suffix="${artifact_name#agentbox-}"
            find "$artifact_dir" -maxdepth 1 -type f \( -name '*.exe' -o -name '*.dmg' -o -name '*.AppImage' \) -print0 |
              while IFS= read -r -d '' file; do
                filename="${file##*/}"
                extension="${filename##*.}"
                stem="${filename%.*}"
                cp "$file" "release-assets/${stem}-${suffix}.${extension}"
              done
          done
          test -n "$(find release-assets -maxdepth 1 -type f -print -quit)"
          find release-assets -maxdepth 1 -type f -print

      - name: Create or Update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release-assets/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$GITHUB_REF_NAME" release-assets/* --verify-tag --title "$GITHUB_REF_NAME" --generate-notes --repo "$GITHUB_REPOSITORY"
          fi
