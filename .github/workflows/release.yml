name: Build Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            arch: x64
            build_args: --x64
          - os: windows-latest
            arch: arm64
            build_args: --arm64
          - os: macos-latest
            arch: native
            build_args: ''
          - os: ubuntu-latest
            arch: x64
            build_args: --x64
          - os: ubuntu-latest
            arch: arm64
            build_args: --arm64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Setup Node.js and pnpm
        uses: pnpm/setup@v2
        with:
          version: 11.24.0
          runtime: node@24
          cache: true
          install: false

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Quality Checks
        run: pnpm check

      - name: Typecheck & Build
        run: pnpm build

      - name: Package Application
        run: pnpm exec electron-builder --publish never ${{ matrix.build_args }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Artifacts
        uses: actions/upload-artifact@v6
        with:
          name: agentbox-${{ runner.os }}-${{ matrix.arch }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.AppImage
