version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      build-and-test:
        patterns:
          - vite
          - vitest
          - '@vitest/*'
          - '@vitejs/*'
          - electron-vite
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
